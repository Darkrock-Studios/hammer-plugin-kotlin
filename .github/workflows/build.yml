name: Build

# Tests and packages the plugin on every push and pull request. Pushing a tag such as v0.1.0 also makes a
# GitHub release with the .hammerplugin attached, which writers can download and install.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Test and package
        run: ./gradlew --no-daemon jvmTest hammerPlugin

      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: build/*.hammerplugin

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/*.hammerplugin
